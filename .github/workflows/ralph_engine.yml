name: Ralph Engine

on:
  workflow_dispatch:
    inputs:
      command:
        description: "new or adjust"
        required: true
        type: string
      instruction:
        description: "What Ralph should do"
        required: true
        type: string
      pr_id:
        description: "PR number (for adjust command)"
        required: false
        type: string
      model:
        description: "AI model override (provider/model format). Leave empty to use LITELLM_MODEL secret."
        required: false
        default: ""
        type: string
      max_iterations:
        description: "Maximum agent loop iterations (default: 5)"
        required: false
        default: "5"
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  agent-exec:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Resolve PR branch
        if: inputs.command == 'adjust'
        id: resolve_pr_ref
        env:
          GH_TOKEN: ${{ secrets.MY_PAT }}
        run: |
          BRANCH=$(gh pr view ${{ inputs.pr_id }} --repo elastic/kibana --json headRefName -q .headRefName)
          echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "PR #${{ inputs.pr_id }} is on branch: $BRANCH"

      - name: Checkout upstream (new task)
        if: inputs.command == 'new'
        uses: actions/checkout@v4
        with:
          repository: elastic/kibana
          ref: main
          fetch-depth: 10

      - name: Checkout fork (adjust task)
        if: inputs.command == 'adjust'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve_pr_ref.outputs.ref }}
          fetch-depth: 10
          token: ${{ secrets.MY_PAT }}

      - name: Ralph Context Assembly
        env:
          GH_TOKEN: ${{ secrets.MY_PAT }}
          PR_ID: ${{ inputs.pr_id }}
        run: |
          if [ "${{ inputs.command }}" == "adjust" ]; then
            if [ -z "${{ inputs.pr_id }}" ]; then
              echo "ERROR: pr_id is required for adjust command"
              exit 1
            fi

            gh api "repos/${{ github.repository }}/contents/format_pr_context.py?ref=${{ github.event.repository.default_branch }}" --jq .content | base64 -d > format_pr_context.py

            gh pr view "$PR_ID" --repo elastic/kibana --json title,body,state,labels,headRefName,baseRefName > .ralph_pr_meta.json
            gh api "repos/elastic/kibana/issues/$PR_ID/comments?per_page=50" > .ralph_issue_comments.json 2>/dev/null || echo "[]" > .ralph_issue_comments.json
            gh api "repos/elastic/kibana/pulls/$PR_ID/comments?per_page=50" > .ralph_review_comments.json 2>/dev/null || echo "[]" > .ralph_review_comments.json

            git diff --name-only origin/main...HEAD > .ralph_diff_summary.txt 2>/dev/null || true

            python3 format_pr_context.py

            rm -f .ralph_pr_meta.json .ralph_issue_comments.json .ralph_review_comments.json .ralph_diff_summary.txt
            echo "Checked out PR #$PR_ID — context written to .ralph_context.md"
          else
            echo "New task mode — checked out elastic/kibana:main"
          fi

      - name: Configure fork remote for push
        env:
          GH_TOKEN: ${{ secrets.MY_PAT }}
        run: |
          FORK_REPO="${{ github.repository }}"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${FORK_REPO}.git"
          git remote add upstream https://github.com/elastic/kibana.git || true
          git config user.name "Joe Reuter"
          git config user.email "johannes.reuter@elastic.co"
          echo "origin  → ${FORK_REPO} (push with PAT)"
          echo "upstream → elastic/kibana (read-only)"

           # For new tasks on upstream checkout, create a feature branch
           if [ "${{ inputs.command }}" == "new" ]; then
             BRANCH_NAME="ralph-$(date +%s)"
             git checkout -b "$BRANCH_NAME"
           fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'

      - name: Bootstrap Kibana
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: |
          corepack enable
          mkdir -p "$HOME/.moon/temp" "$HOME/.moon/plugins/toolchains"
          yarn kbn bootstrap --no-vscode || yarn kbn bootstrap --no-vscode

      - name: Install OpenCode
        run: |
          npm install -g opencode-ai@1.4.7

      - name: Configure OpenCode
        env:
          LITELLM_BASE_URL: ${{ secrets.LITELLM_BASE_URL }}
          LITELLM_MODEL: ${{ secrets.LITELLM_MODEL }}
        run: |
          MODEL="${LITELLM_MODEL:-claude-sonnet-4-20250514}"
          BASE_URL="${LITELLM_BASE_URL:-https://litellm.elastic.co/v1}"
          cat > opencode.json <<EOF
          {
            "\$schema": "https://opencode.ai/config.json",
            "snapshot": false,
            "provider": {
              "litellm": {
                "npm": "@ai-sdk/openai-compatible",
                "name": "LiteLLM",
                "options": {
                  "baseURL": "${BASE_URL}",
                  "apiKey": "{env:LITELLM_API_KEY}"
                },
                "models": {
                  "${MODEL}": {
                    "name": "${MODEL}"
                  }
                }
              }
            }
          }
          EOF

      - name: Resolve model
        id: resolve_model
        env:
          LITELLM_MODEL: ${{ secrets.LITELLM_MODEL }}
        run: |
          if [ -n "${{ inputs.model }}" ]; then
            echo "model=${{ inputs.model }}" >> "$GITHUB_OUTPUT"
          else
            echo "model=litellm/${LITELLM_MODEL:-claude-sonnet-4-20250514}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Task Prompt
        run: |
          PROTOCOL=""
          if [ -f "AGENT_LOOP_PROTOCOL_GHRALPH.md" ]; then
            PROTOCOL=$(cat AGENT_LOOP_PROTOCOL_GHRALPH.md)
          fi

          CONTEXT=""
          if [ "${{ inputs.command }}" == "adjust" ] && [ -f .ralph_context.md ]; then
            CONTEXT=$(cat .ralph_context.md)
          fi

          cat > .ralph_task.md <<-'TASK_HEADER'
          	You are Ralph, an AI coding agent running in a GitHub Actions workflow.
          	
          	TASK_HEADER

          if [ -n "$PROTOCOL" ]; then
            echo "" >> .ralph_task.md
            echo "$PROTOCOL" >> .ralph_task.md
          fi

          cat >> .ralph_task.md <<-'TASK_MID'
          	
          	---
          	
          	## Instruction
          	
          	TASK_MID

          echo "${{ inputs.instruction }}" >> .ralph_task.md

          if [ -n "$CONTEXT" ]; then
            cat >> .ralph_task.md <<-'TASK_CTX'
          	
          	## PR Context
          	
          	TASK_CTX
            echo "$CONTEXT" >> .ralph_task.md
          fi

          echo "Task prompt written to .ralph_task.md"

      - name: Run Agent (with automatic retries)
        env:
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
          GH_TOKEN: ${{ secrets.MY_PAT }}
          MODEL: ${{ steps.resolve_model.outputs.model }}
        run: |
          set -o pipefail
          MAX_ATTEMPTS=10
          TASK_FILE=".ralph_task.md"
          OUTPUT_LOG="ralph-output.md"
          ATTEMPT=0
           get_task_status() {
             if [ -f ".ralph_status" ]; then
               cat ".ralph_status" | tr '[:upper:]' '[:lower:]' | tr -d ' '
             else
               echo "unknown"
             fi
           }
          > "$OUTPUT_LOG"
          while [[ $ATTEMPT -lt $MAX_ATTEMPTS ]]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "Agent attempt $ATTEMPT / $MAX_ATTEMPTS"
            if ! opencode run "$(cat "$TASK_FILE")" --model "$MODEL" 2>&1 | tee -a "$OUTPUT_LOG"; then
              echo "[Attempt $ATTEMPT failed]"
            fi
            STATUS=$(get_task_status)
            echo "[Task status: $STATUS]"
            if [[ "$STATUS" == "done" ]]; then
              echo "SUCCESS on attempt $ATTEMPT"
              exit 0
            elif [[ "$STATUS" == "aborted" ]]; then
              echo "Task aborted"
              exit 1
            fi
            if [[ $ATTEMPT -lt $MAX_ATTEMPTS ]]; then
              FAILURE_CONTEXT=$(tail -100 "$OUTPUT_LOG" 2>/dev/null || echo "No output")
              cat >> "$TASK_FILE" <<APPEND_EOF
          
          ---
          
          ## Attempt $ATTEMPT Feedback
          
          Last output from attempt $ATTEMPT:
          
          \`\`\`
          ${FAILURE_CONTEXT}
          \`\`\`
          
          APPEND_EOF
              echo "[Retry with feedback]"
            fi
          done
          echo "Max attempts reached"
          exit 1

      - name: Push Changes
        env:
          GH_TOKEN: ${{ secrets.MY_PAT }}
        run: |
          rm -f opencode.json .ralph_task.md .ralph_fix_task.md .ralph_context.md .ralph_status ralph-output.md format_pr_context.py AGENT_LOOP_PROTOCOL_GHRALPH.md
          rm -rf agent/

           if [ "${{ inputs.command }}" == "new" ]; then
             if [ -f .ralph_pr_title.md ]; then
               PR_TITLE=$(cat .ralph_pr_title.md | head -1)
             else
               PR_TITLE="Ralph: ${{ inputs.instruction }}"
             fi
             if [ -f .ralph_pr_body.md ]; then
               PR_BODY=$(cat .ralph_pr_body.md)
             else
               PR_BODY="Drafted by Ralph Engine.

           Instruction: ${{ inputs.instruction }}

           ---
           *This PR was created automatically by the Ralph Engine GitHub Action.*"
             fi
           fi

           # Delete PR metadata files BEFORE committing them
           rm -f .ralph_pr_title.md .ralph_pr_body.md

           UNSTAGED=0
          if ! git diff --quiet 2>/dev/null; then UNSTAGED=1; fi
          if ! git diff --cached --quiet 2>/dev/null; then UNSTAGED=1; fi
          if [ -n "$(git ls-files --others --exclude-standard)" ]; then UNSTAGED=1; fi

          if [ "$UNSTAGED" -eq 1 ]; then
            git add -A
            INSTRUCTION="${{ inputs.instruction }}"
            COMMIT_MSG="Ralph: ${INSTRUCTION}"
            if [ ${#COMMIT_MSG} -gt 72 ]; then
              COMMIT_MSG="${COMMIT_MSG:0:69}..."
            fi
            git commit -m "$COMMIT_MSG"
          fi

           CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)

           # For new tasks, we're on a feature branch and need to push it
           if [ "${{ inputs.command }}" == "new" ]; then
             # Push the feature branch (it doesn't exist on origin yet)
             git push -u origin "$CURRENT_BRANCH"
           else
             # For adjust tasks, we're on the PR's existing branch
             UNPUSHED=$(git log origin/"$CURRENT_BRANCH"..HEAD --oneline 2>/dev/null || echo "unknown")

             if [ "$UNPUSHED" = "" ] || [ "$UNPUSHED" = "unknown" ]; then
               echo "No unpushed commits"
               exit 0
             fi

             echo "Unpushed commits:"
             echo "$UNPUSHED"
             git push origin "$CURRENT_BRANCH"
           fi

          INSTRUCTION="${{ inputs.instruction }}"

          if [ "${{ inputs.command }}" == "new" ]; then
            FORK_OWNER="${{ github.repository_owner }}"
            gh pr create \
              --repo elastic/kibana \
              --head "${FORK_OWNER}:${CURRENT_BRANCH}" \
              --base main \
              --title "${PR_TITLE}" \
              --body "${PR_BODY}" \
              --draft
          else
            gh pr comment ${{ inputs.pr_id }} --body "Ralph applied changes for: ${INSTRUCTION}

          ---
          *Updated by Ralph Engine.*"
          fi

      - name: Cleanup
        if: always()
        run: |
          rm -f .ralph_task.md .ralph_fix_task.md .ralph_context.md ralph-output.md
